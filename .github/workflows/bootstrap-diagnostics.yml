name: Bootstrap diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PROJECT_FOUNDRY_EVENT_NAME: ${{ github.event_name }}
      PROJECT_FOUNDRY_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROJECT_FOUNDRY_GITHUB_REF: ${{ github.ref }}
      PROJECT_FOUNDRY_PR_NUMBER: ${{ github.event.pull_request.number }}
      PROJECT_FOUNDRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROJECT_FOUNDRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROJECT_FOUNDRY_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PROJECT_FOUNDRY_SYNTHETIC_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
      PROJECT_FOUNDRY_PUSH_BEFORE_SHA: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check structural and semantic contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.validation_semantics import load_and_validate_structures, validate_semantics
          documents, issues = load_and_validate_structures(Path('.'))
          issues.extend(validate_semantics(documents) if not issues else [])
          for issue in issues:
              print(f"{issue.code}: {issue.message}")
          raise SystemExit(bool(issues))
          PY
      - name: Collect compatibility hosted evidence
        run: |
          provenance_path="$RUNNER_TEMP/project-foundry-hosted-provenance.json"
          python scripts/collect_hosted_provenance.py --root . --output "$provenance_path"
          printf 'PROJECT_FOUNDRY_HOSTED_PROVENANCE_PATH=%s\n' "$provenance_path" >> "$GITHUB_ENV"
      - name: Check execution and Git provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.validation_bootstrap import apply_bootstrap_compatibility
          from scripts.validation_execution import validate_execution_controls
          from scripts.validation_semantics import load_and_validate_structures
          documents, structural = load_and_validate_structures(Path('.'))
          issues = structural or apply_bootstrap_compatibility(
              Path('.'), validate_execution_controls(documents, root=Path('.'))
          )
          for issue in issues:
              print(f"{issue.code}: {issue.message}")
          raise SystemExit(bool(issues))
          PY
      - name: Check workflow-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.validation_workflow import validate_workflow
          issues = validate_workflow(Path('.'))
          for issue in issues:
              print(f"{issue.code}: {issue.message}")
          raise SystemExit(bool(issues))
          PY
      - name: Run complete validator
        run: python scripts/validate_repository.py --root .
