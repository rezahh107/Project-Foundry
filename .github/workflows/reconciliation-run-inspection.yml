name: Reconciliation run inspection

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Fetch exact source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -Lsf "https://github.com/$GITHUB_REPOSITORY/archive/c9edf1aed7662eec795cf0dbb33e88a1389c899c.tar.gz" -o "$RUNNER_TEMP/source.tar.gz"
          mkdir source
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C source
      - name: Print concise semantic failure
        shell: bash
        working-directory: source
        run: |
          set +e
          python -m unittest -v tests.test_semantics_workflow.SemanticReferenceTests > "$RUNNER_TEMP/semantic.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/semantic.log"
          exit "$result"
