name: Validator diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact head quietly
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "$TARGET_SHA"
      - name: Print validator result
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          PROJECT_FOUNDRY_EVENT_NAME: pull_request
          PROJECT_FOUNDRY_GITHUB_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          PROJECT_FOUNDRY_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_FOUNDRY_PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_FOUNDRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROJECT_FOUNDRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROJECT_FOUNDRY_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/project-foundry-hosted-provenance.json"
          python scripts/collect_hosted_provenance.py --root . --output "$path" >/dev/null
          export PROJECT_FOUNDRY_HOSTED_PROVENANCE_PATH="$path"
          python scripts/validate_repository.py --root .
