name: Provenance diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Capture focused provenance failure
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_git_provenance.GitProvenanceIntegrationTests.test_branch_receipt_chain_and_latest_head_only_push > /tmp/provenance.log 2>&1
          printf '%s\n' "$?" > /tmp/provenance.rc
          wc -c < /tmp/provenance.log > /tmp/provenance.bytes
          exit 0
      - name: Return code is 1
        if: always()
        run: 'test "$(cat /tmp/provenance.rc)" != "1"'
      - name: Return code is 2
        if: always()
        run: 'test "$(cat /tmp/provenance.rc)" != "2"'
      - name: Return code is 124
        if: always()
        run: 'test "$(cat /tmp/provenance.rc)" != "124"'
      - name: Return code is 137
        if: always()
        run: 'test "$(cat /tmp/provenance.rc)" != "137"'
      - name: Log is empty
        if: always()
        run: 'test "$(cat /tmp/provenance.bytes)" != "0"'
      - name: Observed PFV diagnostic
        if: always()
        run: '! grep -q "PFV-" /tmp/provenance.log'
      - name: Observed Python exception
        if: always()
        run: '! grep -Eq "(AssertionError|SyntaxError|ImportError|ModuleNotFoundError|RuntimeError|TypeError|AttributeError|FileNotFoundError|TimeoutExpired|SystemExit)" /tmp/provenance.log'
      - name: Observed unittest failure marker
        if: always()
        run: '! grep -Eq "(FAIL|ERROR)" /tmp/provenance.log'
      - name: Focused provenance result
        if: always()
        shell: bash
        run: |
          tail -n 40 /tmp/provenance.log
          test "$(cat /tmp/provenance.rc)" = "0"
