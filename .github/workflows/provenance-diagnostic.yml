name: Provenance diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Capture focused provenance failure
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_git_provenance.GitProvenanceIntegrationTests.test_branch_receipt_chain_and_latest_head_only_push > /tmp/provenance.log 2>&1
          printf '%s\n' "$?" > /tmp/provenance.rc
          exit 0
      - name: Observed PFR diagnostic
        continue-on-error: true
        run: '! grep -q "PFR-" /tmp/provenance.log'
      - name: Observed AssertionError
        continue-on-error: true
        run: '! grep -q "AssertionError" /tmp/provenance.log'
      - name: Observed KeyError
        continue-on-error: true
        run: '! grep -q "KeyError" /tmp/provenance.log'
      - name: Observed ValueError
        continue-on-error: true
        run: '! grep -q "ValueError" /tmp/provenance.log'
      - name: Observed JSON error
        continue-on-error: true
        run: '! grep -q "JSONDecodeError\|JSON" /tmp/provenance.log'
      - name: Observed Git assertion
        continue-on-error: true
        run: '! grep -q "git .* failed\|fatal:" /tmp/provenance.log'
      - name: Observed unittest failure
        continue-on-error: true
        run: '! grep -q "FAILED\|ERROR:" /tmp/provenance.log'
      - name: Observed render failure
        continue-on-error: true
        run: '! grep -q "render\|Render" /tmp/provenance.log'
      - name: Focused provenance result
        shell: bash
        run: |
          tail -n 40 /tmp/provenance.log
          test "$(cat /tmp/provenance.rc)" = "0"
