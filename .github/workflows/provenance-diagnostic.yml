name: Provenance diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Capture focused provenance failure
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_git_provenance.GitProvenanceIntegrationTests.test_branch_receipt_chain_and_latest_head_only_push > /tmp/provenance.log 2>&1
          printf '%s\n' "$?" > /tmp/provenance.rc
          exit 0
      - name: Observed SyntaxError
        continue-on-error: true
        run: '! grep -q "SyntaxError" /tmp/provenance.log'
      - name: Observed ImportError
        continue-on-error: true
        run: '! grep -q "ImportError" /tmp/provenance.log'
      - name: Observed ModuleNotFoundError
        continue-on-error: true
        run: '! grep -q "ModuleNotFoundError\|No module named" /tmp/provenance.log'
      - name: Observed RuntimeError
        continue-on-error: true
        run: '! grep -q "RuntimeError" /tmp/provenance.log'
      - name: Observed TypeError
        continue-on-error: true
        run: '! grep -q "TypeError" /tmp/provenance.log'
      - name: Observed AttributeError
        continue-on-error: true
        run: '! grep -q "AttributeError" /tmp/provenance.log'
      - name: Observed FileNotFoundError
        continue-on-error: true
        run: '! grep -q "FileNotFoundError\|No such file" /tmp/provenance.log'
      - name: Observed unittest ERROR
        continue-on-error: true
        run: '! grep -q "ERROR" /tmp/provenance.log'
      - name: Observed unittest FAIL
        continue-on-error: true
        run: '! grep -q "FAIL" /tmp/provenance.log'
      - name: Focused provenance result
        shell: bash
        run: |
          tail -n 40 /tmp/provenance.log
          test "$(cat /tmp/provenance.rc)" = "0"
