name: Provenance diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Capture focused provenance failure
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_git_provenance.GitProvenanceIntegrationTests.test_branch_receipt_chain_and_latest_head_only_push > /tmp/provenance.log 2>&1
          printf '%s\n' "$?" > /tmp/provenance.rc
          exit 0
      - name: Observed PFV-034
        if: always()
        run: '! grep -q "PFV-034" /tmp/provenance.log'
      - name: Observed PFV-035
        if: always()
        run: '! grep -q "PFV-035" /tmp/provenance.log'
      - name: Observed PFV-036
        if: always()
        run: '! grep -q "PFV-036" /tmp/provenance.log'
      - name: Observed PFV-037
        if: always()
        run: '! grep -q "PFV-037" /tmp/provenance.log'
      - name: Observed PFV-084
        if: always()
        run: '! grep -q "PFV-084" /tmp/provenance.log'
      - name: Observed PFV-086
        if: always()
        run: '! grep -q "PFV-086" /tmp/provenance.log'
      - name: Observed PFV-087
        if: always()
        run: '! grep -q "PFV-087" /tmp/provenance.log'
      - name: Observed AssertionError
        if: always()
        run: '! grep -q "AssertionError" /tmp/provenance.log'
      - name: Observed RuntimeError
        if: always()
        run: '! grep -q "RuntimeError" /tmp/provenance.log'
      - name: Observed other Python exception
        if: always()
        run: '! grep -Eq "(SyntaxError|ImportError|ModuleNotFoundError|TypeError|AttributeError|FileNotFoundError|TimeoutExpired|SystemExit)" /tmp/provenance.log'
      - name: Focused provenance result
        if: always()
        shell: bash
        run: |
          tail -n 40 /tmp/provenance.log
          test "$(cat /tmp/provenance.rc)" = "0"
