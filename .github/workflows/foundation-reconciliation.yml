# One-time owner-authorized activation with fail-closed resume support.
name: Foundation reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/foundation-reconciliation.yml
  workflow_run:
    workflows:
      - Foundation validation
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  initialize-reconciliation:
    name: Create exact PF-001 reconciliation PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RECONCILIATION_BRANCH: agent/reconcile-foundation-state
    steps:
      - name: Check out trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create or resume validated branch receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Project Foundry Reconciler'
          git config user.email 'project-foundry-reconciler@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin "$RECONCILIATION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$RECONCILIATION_BRANCH"
            git switch -C "$RECONCILIATION_BRANCH" "origin/$RECONCILIATION_BRANCH"
            status="$(python - <<'PY'
          import json
          data=json.load(open('planning/current-state.v1.json', encoding='utf-8'))
          print(data['current_task_status'])
          PY
            )"
            test "$status" = 'validation_pending'
            subject_sha="$(git rev-parse HEAD)"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$RECONCILIATION_BRANCH" --state open --json number --jq 'if length == 1 then .[0].number else error("expected one open reconciliation PR") end')"
            python scripts/foundation_reconcile.py validated-on-branch \
              --subject-sha "$subject_sha" \
              --pr-number "$pr_number" \
              --branch "$RECONCILIATION_BRANCH"
            git add planning/execution-program.v1.json planning/current-state.v1.json PROJECT_CHARTER.md SYSTEM_MAP.md planning/NEXT_WORK.md
            git commit -m 'Record exact PF-001 branch validation receipt'
            git push origin "HEAD:$RECONCILIATION_BRANCH"
            exit 0
          fi

          git switch -c "$RECONCILIATION_BRANCH"
          python scripts/foundation_reconcile.py validation-pending
          git add planning/execution-program.v1.json planning/current-state.v1.json PROJECT_CHARTER.md SYSTEM_MAP.md planning/NEXT_WORK.md
          git commit -m 'Transition PF-001 to validation pending'
          git commit --allow-empty -m 'Establish immutable branch validation subject'
          subject_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "$RECONCILIATION_BRANCH"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$RECONCILIATION_BRANCH" --title 'Reconcile PF-001 and activate PF-002' --body 'This owner-authorized lifecycle PR records exact branch validation, advances PF-001 to merge_pending only after canonical CI and external attestation, and enables evidence-bound post-Merge reconciliation. It does not alter the North Star, Program identity, Scope identity, or DEC-002.')"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          python scripts/foundation_reconcile.py validated-on-branch \
            --subject-sha "$subject_sha" \
            --pr-number "$pr_number" \
            --branch "$RECONCILIATION_BRANCH"
          git add planning/execution-program.v1.json planning/current-state.v1.json PROJECT_CHARTER.md SYSTEM_MAP.md planning/NEXT_WORK.md
          git commit -m 'Record exact PF-001 branch validation receipt'
          git push origin "$RECONCILIATION_BRANCH"

  advance-reconciliation:
    name: Advance externally attested PF-001 lifecycle
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RECONCILIATION_BRANCH: agent/reconcile-foundation-state
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    steps:
      - name: Verify canonical run with immutable external attestor
        uses: rezahh107/Post-Merge-Auditor/attestors/project_foundry_v1@c17da77665a7ab4416e5084f93cc03c1d3532cba
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          workflow-run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          expected-workflow-id: "315675709"
          expected-workflow-path: .github/workflows/foundation-validation.yml
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          expected-event: ${{ github.event.workflow_run.event }}
          expected-pr-number: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
          expected-head-ref: ${{ github.event.workflow_run.head_branch }}
          expected-base-ref: main
      - name: Check out exact attested subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Advance lifecycle or merge exact PR Head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RUN_HEAD_SHA"
          git config user.name 'Project Foundry Reconciler'
          git config user.email 'project-foundry-reconciler@users.noreply.github.com'
          status="$(python - <<'PY'
          import json
          data=json.load(open('planning/current-state.v1.json', encoding='utf-8'))
          print(data['current_task_status'])
          PY
          )"

          if [[ "$RUN_EVENT" == 'pull_request' && "$RUN_HEAD_BRANCH" == "$RECONCILIATION_BRANCH" ]]; then
            test -n "$RUN_PR_NUMBER"
            if [[ "$status" == 'validated_on_branch' ]]; then
              git switch -C "$RECONCILIATION_BRANCH"
              python scripts/foundation_reconcile.py merge-pending
              git add planning/execution-program.v1.json planning/current-state.v1.json PROJECT_CHARTER.md SYSTEM_MAP.md planning/NEXT_WORK.md
              git commit -m 'Advance externally attested PF-001 to merge pending'
              git push origin "HEAD:$RECONCILIATION_BRANCH"
            elif [[ "$status" == 'merge_pending' ]]; then
              response="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$RUN_PR_NUMBER/merge" -f merge_method=merge -f sha="$RUN_HEAD_SHA")"
              python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("merged") is True, data' <<<"$response"
            fi
            exit 0
          fi

          if [[ "$RUN_EVENT" == 'push' && "$RUN_HEAD_BRANCH" == 'main' ]]; then
            git switch -C main
            if [[ "$status" == 'merge_pending' ]]; then
              parents=( $(git show -s --format=%P "$RUN_HEAD_SHA") )
              test "${#parents[@]}" -eq 2
              gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_HEAD_SHA/pulls" > "$RUNNER_TEMP/merge-pulls.json"
              read -r pr_number pr_head_sha < <(python - "$RUN_HEAD_SHA" "$RUNNER_TEMP/merge-pulls.json" <<'PY'
          import json,sys
          integration,path=sys.argv[1:]
          pulls=json.load(open(path, encoding='utf-8'))
          matches=[item for item in pulls if item.get('merged_at') and item.get('merge_commit_sha')==integration]
          if len(matches)!=1:
              raise SystemExit(f'expected one hosted merged PR, observed {len(matches)}')
          print(matches[0]['number'], matches[0]['head']['sha'])
          PY
              )
              python scripts/foundation_reconcile.py merged \
                --integration-sha "$RUN_HEAD_SHA" \
                --pr-head-sha "$pr_head_sha" \
                --pr-number "$pr_number"
              git add planning/execution-program.v1.json planning/current-state.v1.json PROJECT_CHARTER.md SYSTEM_MAP.md planning/NEXT_WORK.md
              git commit -m 'Record hosted Merge receipt for PF-001'
              git push origin HEAD:main
            elif [[ "$status" == 'merged' ]]; then
              python scripts/foundation_reconcile.py current-main-verified
              git add -A
              git commit -m 'Verify PF-001 on current main and activate PF-002'
              git push origin HEAD:main
            fi
          fi
