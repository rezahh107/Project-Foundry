# One-time owner-authorized PF-001 lifecycle reconciliation.
name: Foundation reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/foundation-reconciliation.yml
      - scripts/foundation_reconciliation_controller.sh
      - scripts/foundation_reconcile.py
      - scripts/validation_bootstrap_followup.py
      - tests/**
  workflow_run:
    workflows:
      - Foundation validation
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  initialize-reconciliation:
    name: Build exact PF-001 reconciliation history
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild and authorize exact branch receipt
        run: bash scripts/foundation_reconciliation_controller.sh initialize

  advance-reconciliation:
    name: Advance externally attested PF-001 lifecycle
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    steps:
      - name: Verify canonical run with immutable external attestor
        uses: rezahh107/Post-Merge-Auditor/attestors/project_foundry_v1@662fd78c4ee08bd5aeb3e68aee84f5d970a85ef4
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          workflow-run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
          expected-workflow-id: "315675709"
          expected-workflow-path: .github/workflows/foundation-validation.yml
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          expected-event: ${{ github.event.workflow_run.event }}
          expected-pr-number: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
          expected-head-ref: ${{ github.event.workflow_run.head_branch }}
          expected-base-ref: main
      - name: Check out exact attested subject
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Advance lifecycle without bot-authored Merge or main push
        run: bash scripts/foundation_reconciliation_controller.sh advance
